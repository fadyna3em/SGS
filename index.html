<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقييمات الكشافه SGS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p:#0b3d6e;--c:#fff;--t:#1b2430}html[data-th=dark]{--c:#16213e;--t:#e8ecf5}
*{box-sizing:border-box}body{margin:0;transition:color .4s;font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:transparent;color:var(--t)}
header{background:var(--p);color:#fff;text-align:center;padding:10px 12px}
.hr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lg{width:78px;height:78px;border-radius:50%;background:#fff;object-fit:contain;padding:3px}
h1{margin:4px 0;font-size:1.5rem}.bs{font-size:1.15rem;margin:2px 0}.dt{font-size:.85rem;opacity:.95}
button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;margin:2px}button.g{background:#6b7785}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:20px;max-width:1000px;margin:auto}
.card{background:var(--c);border-radius:16px;padding:26px 14px;text-align:center;box-shadow:0 3px 12px #0002;cursor:pointer;border-top:6px solid var(--p);transition:.2s}.card:hover{transform:translateY(-4px)}
.ic{font-size:3rem}.box{max-width:380px;margin:30px auto;background:var(--c);padding:20px;border-radius:14px;box-shadow:0 3px 12px #0002}
input,select{width:100%;padding:8px;margin:4px 0;border:1px solid #bcc6d3;border-radius:8px;font:inherit}.er{color:#c0392b}
.bar{background:var(--c);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 5px #0002}.bar b{flex:1}
.lay{display:flex;gap:10px;padding:10px}nav{width:170px;flex:none;display:flex;flex-direction:column;gap:6px}
nav a{background:var(--c);padding:10px;border-radius:10px;cursor:pointer;border-right:5px solid transparent}nav a.on{background:var(--p);color:#fff}
main{flex:1;min-width:0}.fm{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;background:var(--c);padding:14px;border-radius:12px}
fieldset{border:1px solid #cdd5e0;border-radius:10px;grid-column:1/-1}.ck{display:inline-block;margin:3px 8px}.ck input{width:auto}
.wk label{display:inline-block;margin:0 6px}.wk input,.wk select{width:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.tile{background:var(--c);border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px #0002}
.tile .n{font-size:1.8rem;font-weight:bold;color:var(--p)}.up{color:#1e8e3e}.dn{color:#c0392b}
.rk{display:flex;align-items:center;gap:8px;margin:6px 0}.rk i{display:block;height:14px;background:var(--p);border-radius:7px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--c)}td,th{padding:6px;border-bottom:1px solid #e1e6ee;text-align:center}
.ok{background:#d9f2e0;padding:8px;border-radius:8px}
@media(max-width:640px){.lay{flex-direction:column}nav{width:100%;flex-direction:row;overflow-x:auto}nav a{white-space:nowrap}}
</style></head><body><div id="sky"><div class="sun"></div><div class="moon"></div><i class="cl" style="top:90px;animation-duration:70s"></i><i class="cl" style="top:190px;animation-duration:95s;animation-delay:-40s;transform:scale(.7)"></i><i class="cl" style="top:300px;animation-duration:120s;animation-delay:-80s"></i><div id="stars"></div></div>

$('#mn').innerHTML=`<h2>🔑 إدارة المستخدمين</h2><div class=fm><label>الكارت<select id=uc>${Object.entries(CARDS).map(([k,c])=>`<option value=${k} ${u.card==k?'selected':''}>${c.n}</option>`).join('')}</select></label><label>اسم المستخدم<input id=un value="${e(u.n||'')}"></label><label>كلمة المرور ${S.ue?'(اتركها فارغة لعدم التغيير)':''}<input id=up type=password></label><label>الفرقة<select id=us>${['*',...TEAMS].map(t=>`<option value="${t}" ${u.sc==t?'selected':''}>${t=='*'?'كل الفرق':t}</option>`).join('')}</select></label><label>الدور<select id=ur><option value=entry>مدخل بيانات</option><option value=admin ${u.role=='admin'?'selected':''}>أدمن (كل الصلاحيات)</option></select></label><fieldset>${ck('ua','يطلب الاسم الثنائي',u.ask)}${ck('uv','يشوف سجلاته',u.v)}${ck('ue','يعدّل سجلاته',u.e)}${ck('ud','يحذف سجلاته',u.d)}</fieldset></div><button onclick="saveU()">💾 ${S.ue?'تحديث':'إضافة'} مستخدم</button>${S.ue?'<button class=g onclick="S.ue=null;usr()">إلغاء</button>':''}<button class=g onclick="mkDef()">⚡ إنشاء المستخدمين الافتراضيين</button>
<div class=sc><table><tr><th>الكارت</th><th>المستخدم</th><th>الفرقة</th><th>الدور</th><th></th></tr>${Object.entries(DB.profiles).map(([i,x])=>`<tr><td>${CARDS[x.card]?.n||'الكل'}</td><td>${e(x.n)}</td><td>${x.sc=='*'?'الكل':x.sc}</td><td>${x.role=='admin'?'أدمن':'مدخل'}</td><td><button onclick="S.ue='${i}';usr()">✏️</button>${i==UID?'':`<button class=g onclick="delU('${i}')">🗑</button>`}</td></tr>`).join('')}</table></div><small>كلمات المرور محفوظة بشكل مشفّر عند Firebase ولا يراها أحد. لتغيير الاسم أو كلمة المرور اكتب كلمة مرور جديدة.</small>`}
async function saveU(){const n=$('#un').value.trim(),p=$('#up').value.trim(),c=$('#uc').value,sc=$('#us').value,ro=$('#ur').value,a=+$('#ua').checked,v=+$('#uv').checked,ee=+$('#ue').checked,d=+$('#ud').checked,o=S.ue?DB.profiles[S.ue]:null;
try{if(o&&!p)await put('profiles/'+S.ue,{...o,sc,role:ro,ask:a,v,e:ee,d});else{if(!n||p.length<3)return alert('اكتب الاسم وكلمة المرور (٣ أحرف على الأقل)');await mk(c,n,p,sc,ro,a,v,ee,d);if(o){await put('profiles/'+S.ue,null);if(o.key!=((ro=='admin'?'admin':c)+'_'+hx(n)))await put('index/'+o.key,null)}}
lg('حفظ مستخدم: '+n);S.ue=null;usr()}catch(x){alert('تعذر الحفظ: '+x)}}
async function delU(i){if(confirm('حذف المستخدم؟')){const x=DB.profiles[i];lg('حذف مستخدم: '+x.n);await put('profiles/'+i,null);x.key&&await put('index/'+x.key,null);usr()}}
async function mkDef(){if(!confirm('إنشاء المستخدمين الافتراضيين؟ (غيّر كلمات مرورهم بعد ذلك)'))return;try{for(const [c,n,p,sc,ask] of DEF){if(Object.values(DB.profiles).some(x=>x.key==c+'_'+hx(n)))continue;await mk(c,n,p,sc,'entry',ask||0,0,0,0)}alert('تم');usr()}catch(x){alert('تعذر: '+x)}}
/* ---------- السجل ---------- */
function logv(){$('#mn').innerHTML='<h2>📜 سجل النشاط</h2><div class=sc><table><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th></tr>'+Object.entries(DB.log).sort((a,b)=>b[0]-a[0]).slice(0,100).map(([i,x])=>`<tr><td>${e(x.t)}</td><td>${e(x.w)}</td><td>${e(x.a)}</td></tr>`).join('')+'</table></div>'}
/* ---------- لوحة المؤشرات ---------- */
const GA=['حضور','معتذر','غياب','متعاقب','لايوجد أجتماع'],GU=['الزي','بدون زي'];
function chg(el){if(!el.checked)return;const o=el.dataset.o,row=el.closest('.sr'),q=x=>row.querySelector('[data-o="'+x+'"]'),off=l=>l.forEach(x=>{if(x!=o)q(x).checked=false});
if(GA.includes(o)){off(GA);if(o!='حضور')off([...GU,'بدون فولار'])}else if(GU.includes(o)){off(GU);q('حضور').checked=true;off(GA.slice(1))}else if(o=='بدون فولار'){q('حضور').checked=true;off(GA.slice(1))}}
const inR=r=>(!S.da||r.v.date>=S.da)&&(!S.db||r.v.date<=S.db),iso=d=>d.toLocaleDateString('en-CA');
function att(L){let n=0,p=0,u=0;L.forEach(r=>Object.values(r.v.sv||{}).forEach(x=>{const o=Object.values(x.o||{});n++;if(o.includes('حضور')){p++;if(o.includes('الزي'))u++}}));return{n,p,u}}
function stats(k){return TEAMS.map(t=>{const L=recs(k,t).filter(inR).sort((a,b)=>a.v.date.localeCompare(b.v.date)),P=L.map(r=>sc(k,r)).filter(x=>x!=null),avg=P.length?P.reduce((a,b)=>a+b)/P.length:null,tr=P.length>1?P[P.length-1]-P[P.length-2]:null;let n;
if(k=='c1'){const l=[...L].reverse().find(r=>r.v.str);n=l?l.v.str:0}else{const z=new Set();L.forEach(r=>(k=='c3'?[r.v.code]:String(r.v.srv||'').split(/[,،]/)).forEach(x=>x&&x.trim()&&z.add(x.trim())));n=z.size}
const A=k=='c1'?att(L):null;return{t,n:L.length,avg,tr,st:n,ap:A&&A.n?A.p/A.n:null,au:A&&A.p?A.u/A.p:null}})}
function heat(k){const R=[],T=TEAMS.map(t=>recs(k,t).filter(inR));
if(k=='c2')CH.filter(c=>c[1]>0).forEach(([o])=>R.push([o,T.map(L=>L.length?L.filter(r=>Object.values(r.v.ch||{}).includes(o)).length/L.length:null)]));
else if(k=='c3')[['الحضور',w=>w.a=='0'],['الزي',w=>w.u=='0'],['مدارس الأحد',w=>w.s],['القداس',w=>w.m],['الالتزام',w=>w.c],['الكتيب',w=>w.b]].forEach(([l,fn],ix)=>R.push([l,T.map((L,ti)=>{let n=0,y=0;L.forEach(r=>Object.values(r.v.w||{}).forEach(w=>{if(w.a===''||w.a==null)return;n++;if(fn(w))y++}));return ti==4&&(ix==2||ix==3)?null:(n?y/n:null)})]));
else F[k].filter(f=>f.s).forEach(f=>R.push([f.l,T.map(L=>{const a=L.map(r=>lv(r.v[f.k])).filter(x=>x!=null);return a.length?a.reduce((x,y)=>x+y)/a.length:null})]));return R}
function qd(x){const d=new Date();S.db=x=='a'?'':iso(d);S.da=x=='a'?'':x=='m'?iso(new Date(d.getFullYear(),d.getMonth(),1)):iso(new Date(d-(x=='w'?6:29)*864e5));dash()}
function dash(){setTimeout(cu,0);const k=S.k,st=stats(k),rk=st.filter(x=>x.avg!=null).sort((a,b)=>b.avg-a.avg),RR=Object.values(DB.recs[k]).filter(inR),all=RR.map(r=>sc(k,r)).filter(x=>x!=null),ov=all.length?all.reduce((a,b)=>a+b)/all.length:null;
const cols=[['n','عدد السجلات',x=>x],['avg','الأداء %',x=>x.toFixed(0)+'%'],['tr','التطور',x=>(x>=0?'▲ ':'▼ ')+Math.abs(x).toFixed(0)+'%'],['st',k=='c1'?'قوة الفريق':k=='c3'?'عدد الأولاد':'عدد الخدام',x=>x],...(k=='c1'?[['ap','حضور الخدام',x=>(x*100).toFixed(0)+'%'],['au','الالتزام بالزي',x=>(x*100).toFixed(0)+'%']]:[])],
bst=c=>{const a=st.map(x=>x[c]).filter(x=>x!=null&&x>0);return a.length?Math.max(...a):null},H=heat(k),hc=v=>v==null?'<td>-</td>':`<td style="background:hsla(${Math.max(0,(v-.3)/.7)*120},70%,50%,.38)">${Math.round(v*100)}%</td>`;
$('#mn').innerHTML=`<h2>📊 لوحة المؤشرات</h2><div class=tb2><label>من <input type=date value="${S.da||''}" onchange="S.da=this.value;dash()"></label><label>إلى <input type=date value="${S.db||''}" onchange="S.db=this.value;dash()"></label><button class=g onclick="qd('w')">آخر ٧ أيام</button><button class=g onclick="qd('m')">هذا الشهر</button><button class=g onclick="qd('30')">آخر ٣٠ يوم</button><button class=g onclick="qd('a')">كل الفترة</button></div>
<div class=tiles><div class=tile>📈 مستوى الأداء العام<div class=n>${ov==null?'-':ov.toFixed(0)+'%'}</div></div><div class=tile>🏆 الفرقة الأولى<div class=n style="font-size:1.3rem">${rk.length?ICON[rk[0].t]+' '+rk[0].t:'-'}</div></div><div class=tile>🗂 عدد السجلات<div class=n>${RR.length}</div></div></div>
<h3>الفرق</h3><div class=tiles>${st.map(x=>`<div class=tile><div style="font-size:1.8rem">${ICON[x.t]}</div><b>${x.t}</b><div class=n>${x.avg==null?'-':x.avg.toFixed(0)+'%'}</div><div>${k=='c1'?'قوة الفريق':k=='c3'?'عدد الأولاد':'عدد الخدام'}: ${x.st}</div><div class="${x.tr>0?'up':x.tr<0?'dn':''}">${x.tr==null?'التطور: -':'التطور: '+(x.tr>=0?'▲ ':'▼ ')+Math.abs(x.tr).toFixed(0)+'%'}</div></div>`).join('')}</div>
<h3>🏅 الترتيب حسب الأداء</h3>${rk.map((x,i)=>`<div class=rk><span style="width:150px">${i+1}. ${ICON[x.t]} ${x.t}</span><i style="width:${x.avg}%"></i><b>${x.avg.toFixed(0)}%</b></div>`).join('')||'<p>لا توجد بيانات في هذه الفترة</p>'}
<h3>⚖️ مقارنة بين الفرق</h3><div class=sc><table class=cmp><tr><th>الفرقة</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr>${st.map(x=>`<tr><td>${ICON[x.t]} ${x.t}</td>${cols.map(([c,,f])=>`<td class="${x[c]!=null&&x[c]>0&&x[c]==bst(c)?'b':''}">${x[c]==null?'-':f(x[c])}</td>`).join('')}</tr>`).join('')}</table></div><small>الخلية الخضراء = الأفضل بين الفرق</small>
<h3>🔥 مقارنة تفصيلية بالبنود</h3><div class=sc><table class=cmp><tr><th>البند</th>${TEAMS.map(t=>`<th>${ICON[t]} ${t}</th>`).join('')}</tr>${H.map(([l,vs])=>`<tr><td style="text-align:right">${l}</td>${vs.map(hc).join('')}</tr>`).join('')}</table></div>
<button class=g onclick="print()">🖨 طباعة</button>`}

function sett(){$('#mn').innerHTML=`<h2>⚙ الإعدادات</h2><div class=box style="margin:0;max-width:600px"><label>لون السيستم <input type=color value="${DB.cfg.color}" onchange="put('cfg/color',this.value);theme()"></label><label>عنوان السيستم<input value="${e(DB.cfg.title||'تقييمات الكشافه SGS')}" onchange="put('cfg/title',this.value);theme()"></label><label>تغيير لوجو الكشافة<input type=file accept="image/*" onchange="logo(this)"></label><button class=g onclick="put('cfg/logo',null);location.reload()">استرجاع اللوجو الأصلي</button><hr><label>رابط قاعدة البيانات<input id=cu value="${e(FB)}"></label><label>Web API Key<input id=ck value="${e(KEY)}"></label><button onclick="saveCfg()">💾 حفظ الربط</button><hr><label>تغيير كلمة مرور حسابي<input id=np type=password></label><button onclick="chp()">🔐 تغيير</button><hr><button onclick="dl(JSON.stringify(DB),'sgs-backup.json','application/json')">⬇ نسخة احتياطية كاملة</button><label>استيراد نسخة احتياطية<input type=file accept=".json" onchange="im(this)"></label><hr><label>مسح كل بيانات كارت<select id=wc>${Object.entries(CARDS).map(([k,c])=>`<option value=${k}>${c.n}</option>`).join('')}</select></label><button class=g onclick="wipeC()">🧹 مسح الكارت</button></div>`}
async function chp(){const p=$('#np').value.trim();if(p.length<4)return alert('٤ أحرف على الأقل');try{setS(await idp('update',{idToken:await tok(),password:PW(p),returnSecureToken:true}));alert('تم تغيير كلمة المرور')}catch(x){alert('تعذر: '+x)}}
function logo(f){const r=new FileReader();r.onload=()=>{if(r.result.length>400000)return alert('الصورة كبيرة، استخدم صورة أصغر');put('cfg/logo',r.result);theme()};r.readAsDataURL(f.files[0])}
function im(f){const r=new FileReader();r.onload=async()=>{try{const d=norm(JSON.parse(r.result));DB=d;cache();if(FB)await api('PUT','',d);alert('تم الاستيراد');sett()}catch(x){alert('ملف غير صالح')}};r.readAsText(f.files[0])}
function wipeC(){const k=$('#wc').value;if(confirm('مسح كل بيانات '+CARDS[k].n+'؟ لا يمكن التراجع')){put('recs/'+k,null);lg('مسح كارت '+CARDS[k].n);alert('تم')}}

const cu=()=>document.querySelectorAll('.n').forEach(el=>{const m=el.textContent.match(/^(\d+)(%?)$/);if(!m)return;const n=+m[1];let i=0;const s=setInterval(()=>{i+=Math.max(1,Math.ceil(n/20));if(i>=n){i=n;clearInterval(s)}el.textContent=i+m[2]},35)});
function setTh(t){document.documentElement.dataset.th=t;try{localStorage.setItem('sgs_th',t)}catch(x){}}
const tgl=()=>setTh(document.documentElement.dataset.th=='dark'?'light':'dark');
setTh(localStorage.getItem('sgs_th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#stars').innerHTML=Array.from({length:90},()=>{const s=1+Math.random()*2.5;return`<i style="top:${Math.random()*100}%;left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-delay:${Math.random()*4}s;animation-duration:${2+Math.random()*3}s"></i>`}).join('');
$('h1').innerHTML=$('h1').textContent.split(' ').map((w,i)=>`<span style="animation-delay:${i*.18}s">${w}</span>`).join(' ');
theme();home();setInterval(pull,8000);
